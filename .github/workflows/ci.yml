# Continuous integration against a disposable local Supabase database.
# Production credentials are intentionally unavailable to this workflow.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sql:
    name: Local database verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned development tools
        run: npm ci

      - name: Verify local workspace safety guards
        run: npm test

      - name: Rebuild and verify the disposable database
        run: npm run db:verify

      - name: Stop the local database
        if: always()
        run: npm run db:stop

  web:
    name: PWA type-check, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the pinned dependencies
        run: npm ci

      - name: Run the unit tests
        run: npm test

      # Placeholders, and that is the whole point: this job proves the bundle
      # compiles, never that it can reach a project. The real values come from
      # the deployment environment, and no credential belongs in CI.
      - name: Type-check and build the production bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: http://127.0.0.1:54321
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-build-check

  functions:
    name: Edge Function format, lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: supabase/functions

    steps:
      - uses: actions/checkout@v7

      # Deno 2.x, matching the Edge Runtime. The dependency tree itself is
      # pinned by deno.lock, which is what actually makes a run reproducible.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check formatting
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Type-check
        run: deno check alerts-notify/index.ts _shared/*_test.ts

      - name: Run the unit tests
        run: deno test
