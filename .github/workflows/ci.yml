# Continuous integration against a disposable local Supabase database.
# Production credentials are intentionally unavailable to this workflow.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sql:
    name: Local database verification
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install pinned development tools
        run: npm ci

      - name: Verify local workspace safety guards
        run: npm test

      - name: Rebuild and verify the disposable database
        run: npm run db:verify

      - name: Stop the local database
        if: always()
        run: npm run db:stop
