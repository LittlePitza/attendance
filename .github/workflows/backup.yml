# Daily database backup.
#
# Why this exists: Supabase's Free plan takes NO backups, automatic or
# downloadable. An attendance record with no backup is indefensible in a payroll
# dispute, so we take the backups ourselves. It runs on GitHub, not on anyone's
# machine: it does not depend on someone leaving a computer switched on.
#
# The dump is ENCRYPTED before upload. It contains 31 people's personal data and
# their attendance history, and a GitHub artifact can be downloaded by anyone
# with read access to the repository. Unencrypted, it would be a leak waiting to
# happen.
#
# Useful side effect: this job queries the database every day, and that alone
# counts as activity against the Free plan's pause-for-inactivity rule. There is
# still a separate keepalive, because if this job fails the project should not
# lose its heartbeat too.

name: Daily backup

on:
  schedule:
    # 10:00 UTC = 04:00 America/Mexico_City, after the pg_cron maintenance jobs.
    - cron: '0 10 * * *'
  workflow_dispatch:        # also on demand, before a large migration

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    name: Dump and encrypt
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install the Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Dump schema, data and roles
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL:-}" ]; then
            echo "Missing the SUPABASE_DB_URL secret. See docs/free-plan.md" >&2
            exit 1
          fi
          mkdir -p dump
          # Three separate pieces, so a restore can bring back just the schema,
          # or just the data, without hand-editing a 14 MB file.
          supabase db dump --db-url "$DB_URL" -f dump/roles.sql  --role-only
          supabase db dump --db-url "$DB_URL" -f dump/schema.sql
          supabase db dump --db-url "$DB_URL" -f dump/data.sql   --data-only
          ls -lh dump/

      - name: Encrypt
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${PASSPHRASE:-}" ]; then
            echo "Missing the BACKUP_PASSPHRASE secret. Nothing is uploaded unencrypted." >&2
            exit 1
          fi
          tar -czf dump.tar.gz -C dump .
          gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase "$PASSPHRASE" \
              --output "backup-$(date -u +%Y%m%d).tar.gz.gpg" \
              dump.tar.gz
          # The plaintext must never reach the artifact.
          rm -rf dump dump.tar.gz
          ls -lh backup-*.gpg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: backup-*.tar.gz.gpg
          # 30 days, not 90: GitHub Free provides 500 MB of artifact storage, and
          # ninety copies would overflow it. To keep history longer, download the
          # copy from the 1st of each month and store it elsewhere.
          retention-days: 30
          if-no-files-found: error
