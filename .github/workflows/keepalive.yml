# Heartbeat so the project does not get paused.
#
# Supabase pauses Free plan projects after 7 days of low DATABASE activity.
# Their documentation is explicit: a few user queries a day are enough to stay
# excluded.
#
# In normal use this is redundant: 31 people punching four times a day generate
# plenty of activity. The risk is the dead stretches — the week off in December,
# or the gap between today and the actual rollout. That is when a project gets
# paused, and un-pausing requires going into the dashboard by hand.
#
# And if it does get paused: there is a 90-day window to restore it from the
# dashboard. After 90 days the only option left is downloading the backup. That
# is why this file and backup.yml complement each other — one avoids the pause,
# the other covers the case where it happens anyway.
#
# Costs about 30 seconds of CI a day and consumes no meaningful Supabase quota:
# it is a query that returns a single row.

name: Keepalive

on:
  schedule:
    # 14:00 UTC = 08:00 America/Mexico_City, weekdays and weekends alike.
    - cron: '0 14 * * *'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: true

jobs:
  ping:
    name: Query the database
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Minimal query
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DB_URL:-}" ]; then
            echo "Missing the SUPABASE_DB_URL secret." >&2
            exit 1
          fi
          # It has to be a USER query against user tables: "select 1" touches no
          # table and it is not clear it would count as activity. This one reads
          # two real catalogs and returns one row.
          psql "$DB_URL" -v ON_ERROR_STOP=1 -At -c "
            select 'heartbeat '
                || (select count(*) from public.empleados)   || ' employees, '
                || (select count(*) from public.departments) || ' departments, '
                || now();
          "

      - name: Warn on failure
        if: failure()
        run: |
          echo "::error::The keepalive failed. If this repeats for several days,"
          echo "::error::the project may be paused for inactivity. Check"
          echo "::error::SUPABASE_DB_URL and the project status in the dashboard."
