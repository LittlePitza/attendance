# Configuracion del proyecto para el CLI de Supabase.
#
# Este archivo describe sobre todo el entorno LOCAL (`supabase start`), que
# necesita Docker y hoy no se usa. Se versiona igual por dos razones: el CLI lo
# pide para saber a que proyecto pertenece el directorio, y el dia que alguien
# instale Docker el entorno local arranca igual que el remoto sin adivinar nada.
#
# Lo que SI aplica sin Docker: project_id, que es lo que usa `supabase link`.
#
# Ojo: los ajustes de auth de aqui NO se aplican solos al proyecto remoto. El
# endurecimiento de contrasenas se configura en el panel. Ver docs/runbook.md.

project_id = "cyjpucvvekzfpvvonuld"

[api]
enabled = true
port = 54321
# Los esquemas expuestos por PostgREST. "internal" y "attendance" NO estan aqui
# a proposito: el cliente no debe poder tocar esas tablas ni sus funciones
# internas. Agregarlos deshace la mitad del modelo de seguridad.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]

# Sesion persistente: el empleado no reescribe su contrasena en semanas, pero
# RH puede revocar el acceso de un equipo perdido y la sesion muere ahi.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# No hay registro abierto: las cuentas las crea RH. Un checador donde
# cualquiera se da de alta no sirve de nada.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false
# 12 caracteres. El bloqueo de contrasenas filtradas (HaveIBeenPwned) es
# exclusivo del plan Pro, asi que la longitud y la variedad son la unica
# defensa que queda. Ver docs/free-plan.md.
[auth.email.password]
min_length = 12
required_characters = "abcdefghijklmnopqrstuvwxyz:ABCDEFGHIJKLMNOPQRSTUVWXYZ:0123456789:!@#$%^&*()-_=+[]{};'\"\\|,.<>/?"

[edge_runtime]
enabled = true
policy = "oneshot"
