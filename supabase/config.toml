# Supabase CLI configuration for this project.
#
# This file mostly describes the LOCAL environment (`supabase start`), which
# needs Docker and is not used today. It is versioned anyway for two reasons:
# the CLI needs it to know which project this directory belongs to, and the day
# someone installs Docker the local environment comes up matching the remote one
# without guesswork.
#
# What DOES apply without Docker: project_id, which is what `supabase link` uses.
#
# Note: the auth settings below are NOT applied automatically to the remote
# project. Password hardening is configured in the dashboard. See docs/runbook.md.

project_id = "cyjpucvvekzfpvvonuld"

[api]
enabled = true
port = 54321
# Schemas exposed by PostgREST. "internal" and "attendance" are deliberately
# absent: the client must not be able to touch those tables or their internal
# functions. Adding them here undoes half the security model.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]

# Persistent session: the employee does not retype their password for weeks, but
# HR can revoke access for a lost device and the session dies there.
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# No open signup: HR creates the accounts. A time clock where anyone can
# register themselves is worthless.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

# 12 characters. Leaked-password blocking (HaveIBeenPwned) is Pro only, so
# length and variety are the only defense left. See docs/free-plan.md.
[auth.email.password]
min_length = 12
required_characters = "abcdefghijklmnopqrstuvwxyz:ABCDEFGHIJKLMNOPQRSTUVWXYZ:0123456789:!@#$%^&*()-_=+[]{};'\"\\|,.<>/?"

[edge_runtime]
enabled = true
policy = "oneshot"
